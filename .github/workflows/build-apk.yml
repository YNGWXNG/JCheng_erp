name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libzbar0 \
            libjpeg-dev zlib1g-dev libfreetype6-dev
        shell: bash

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Prepare Android SDK & accept licenses
        run: |
          set -euo pipefail
          # 自动定位 sdkmanager，兼容 runner 环境路径变化
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager -path "*/cmdline-tools/*/bin/sdkmanager" | head -n1)
          
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install \
              "platforms;android-36" \
              "build-tools;36.0.0"
          fi
          
          # Flutter 侧许可证与 SDK 配置
          yes | flutter doctor --android-licenses > /dev/null 2>&1 || true
          flutter config --android-sdk "$ANDROID_SDK_ROOT"
          flutter doctor -v || true
        shell: bash

      # 多维度缓存，大幅提升二次构建速度
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Flutter Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-flutter3.44.7
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install flet-cli==0.86.2
          # 确保 flet 命令在系统 PATH 中
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        shell: bash

      - name: Show environment info
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          python --version
          flutter --version
          flet --version
        shell: bash

      - name: Clean old build
        run: rm -rf build
        shell: bash

      - name: Build APK
        run: |
          set -euo pipefail
          # 自动读取根目录 build.yaml 配置，无需重复传权限参数
          flet build apk --verbose --release
        shell: bash

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 玖诚电器ERP-APK
          path: build/apk/app-release.apk
          compression-level: 9

      # 构建失败时自动上传日志，无需重跑即可排查
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build/flutter/android/app/build/reports
            build/flutter/android/gradle.log
          if-no-files-found: ignore
