name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PIP_EXTRA_INDEX_URL: https://pypi.flet.dev/simple/   # 👈 加这一行

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libzbar0 \
            libjpeg-dev zlib1g-dev libfreetype6-dev
        shell: bash

      - name: Update Android SDK to API 36
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          (set +o pipefail; yes | "$SDKMANAGER" --licenses > /dev/null)
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
        shell: bash

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Configure Flutter for Android build
        run: |
          set -euo pipefail
          flutter config --android-sdk "/usr/local/lib/android/sdk"
          (set +o pipefail; yes | flutter doctor --android-licenses)
          flutter doctor -v || true
        shell: bash

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Clean old build cache
        run: |
          rm -rf build/
          rm -rf .flet
        shell: bash

      - name: Show environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          python --version
          flutter --version
        shell: bash

      - name: Install Python dependencies & lock flet-cli
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          # 强制锁定cli版本与项目flet完全一致0.86.2，避免版本错位打包异常
          pip install flet-cli==0.86.2
          pip show flet flet-camera flet-permission-handler
        shell: bash

      - name: Build APK
        run: |
          set -euo pipefail
          flet build apk --verbose
        shell: bash

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JCheng
          path: build/apk/**/*.apk
