name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Buildozer Docker image
        run: docker pull kivy/buildozer

      - name: Run Buildozer (build APK)
        run: |
          docker run --rm \
            --privileged \
            -e "ANDROID_HOME=/opt/android-sdk" \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            -w "/home/user/hostcwd" \
            kivy/buildozer \
            /bin/bash -lc "pip install --upgrade pip && buildozer -v android debug"

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jiucheng-android-apk
          path: bin/*.apk
