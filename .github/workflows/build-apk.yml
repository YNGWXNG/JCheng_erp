name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libzbar0 \
            libjpeg-dev zlib1g-dev libfreetype6-dev
        shell: bash

      # 升级Android SDK组件，满足Flutter 3.44.7的API 36要求
      - name: Update Android SDK to API 36
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          
          # 接受所有SDK许可证（规避管道破裂报错）
          (set +o pipefail; yes | "$SDKMANAGER" --licenses > /dev/null)
          
          # 安装API 36平台与对应构建工具
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"
        shell: bash

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Configure Flutter for Android build
        run: |
          set -euo pipefail
          # 指向系统预装的Android SDK
          flutter config --android-sdk "/usr/local/lib/android/sdk"
          # 自动接受Android许可证
          (set +o pipefail; yes | flutter doctor --android-licenses)
          # 验证环境（非致命错误不中断构建）
          flutter doctor -v || true
        shell: bash

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Show environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          python --version
          flutter --version
          flet --version || true
        shell: bash

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install flet-cli==0.86.2
        shell: bash

      - name: Build APK
        run: |
          set -euo pipefail
          flet build apk --verbose \
            --android-permissions android.permission.INTERNET=true \
            --android-permissions android.permission.CAMERA=true \
            --android-permissions android.permission.READ_EXTERNAL_STORAGE=true \
            --android-permissions android.permission.WRITE_EXTERNAL_STORAGE=true \
            --android-permissions android.permission.READ_MEDIA_IMAGES=true
        shell: bash

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JCheng
          path: build/apk/**/*.apk
