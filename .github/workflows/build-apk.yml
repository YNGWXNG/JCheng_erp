name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Use the runner-provided env var instead of the runner context expression.
      ANDROID_SDK_ROOT: $RUNNER_TEMP/android-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK (required for Android tooling)
        id: setup-java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Android SDK command-line tools and packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip wget
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT"
          TOOL_URL="https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip"
          wget -q -O cmdline-tools.zip "$TOOL_URL"
          unzip -q cmdline-tools.zip -d cmdline-tools
          mkdir -p cmdline-tools/latest
          # Move contents into cmdline-tools/latest (the sdk expects cmdline-tools/<name>/bin or latest)
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ || true
          rm cmdline-tools.zip
          # Make tools available to later steps by writing to GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          # Accept licenses and install platforms/build-tools
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        shell: bash

      - name: Show environment info
        run: |
          java -version
          python --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT"
        shell: bash

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install "flet>=0.85.3,<0.87.0" flet-camera
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Build APK
        run: |
          set -euo pipefail
          # auto-confirm prompts
          yes | flet build apk --verbose \
            --android-permissions INTERNET \
            --android-permissions CAMERA \
            --android-permissions READ_EXTERNAL_STORAGE \
            --android-permissions WRITE_EXTERNAL_STORAGE \
            --android-permissions READ_MEDIA_IMAGES
        shell: bash

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JCheng-apk
          path: build/apk/**/*.apk
