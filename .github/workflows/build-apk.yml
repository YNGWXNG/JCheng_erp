name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK (required for Android tooling)
        id: setup-java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Android SDK command-line tools and packages
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip wget

          # Set ANDROID_SDK_ROOT using the runner-provided env (expand here)
          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          cd "$ANDROID_SDK_ROOT"

          TOOL_URL="https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip"
          wget -q -O cmdline-tools.zip "$TOOL_URL"
          unzip -q cmdline-tools.zip -d cmdline-tools
          rm cmdline-tools.zip

          # Handle different unzip layouts robustly:
          if [ -d cmdline-tools/cmdline-tools ]; then
            # usual layout: cmdline-tools/cmdline-tools/{bin,...}
            mv cmdline-tools/cmdline-tools cmdline-tools/latest
          else
            # sometimes the zip extracts into a named folder, find first folder that has bin/
            for d in cmdline-tools/*; do
              if [ -d "$d/bin" ]; then
                mkdir -p cmdline-tools/latest
                # move contents into latest
                mv "$d"/* cmdline-tools/latest/ 2>/dev/null || true
                break
              fi
            done
          fi

          ls -la cmdline-tools
          # make tools executable
          chmod -R +x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" || true

          # Make tools available to this shell immediately and to later steps
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then chmod +x "$SDKMANAGER" || true; fi

          # Accept licenses and install required packages
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

        shell: bash

      - name: Show environment info
        run: |
          # ANDROID_SDK_ROOT was exported into GITHUB_ENV by previous step
          echo "JAVA_HOME=$JAVA_HOME"
          java -version || true
          python --version || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT" || true
        shell: bash
        env:
          # allow this step to see the runner variable until GITHUB_ENV is loaded
          ANDROID_SDK_ROOT: $RUNNER_TEMP/android-sdk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install "flet>=0.85.3,<0.87.0" flet-camera
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Build APK
        run: |
          set -euo pipefail
          # Use flet to build APK; auto-confirm any prompts
          yes | flet build apk --verbose \
            --android-permissions INTERNET \
            --android-permissions CAMERA \
            --android-permissions READ_EXTERNAL_STORAGE \
            --android-permissions WRITE_EXTERNAL_STORAGE \
            --android-permissions READ_MEDIA_IMAGES
        shell: bash

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JCheng
          path: build/apk/**/*.apk
